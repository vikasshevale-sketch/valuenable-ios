name: Build and Export iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build and Archive
        run: |
          xcodebuild -project SecureWorkspace.xcodeproj \
            -scheme SecureWorkspace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SecureWorkspace.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/SecureWorkspace.xcarchive/Products/Applications/SecureWorkspace.app build/Payload/
          cd build
          zip -r SecureWorkspace.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureWorkspace-IPA
          path: build/SecureWorkspace.ipa
          retention-days: 30
